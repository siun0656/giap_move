let si=0,T=[],E=[],sel='L',hint=0,win=0,mx=-99,my=-99,A,fr=0,run=0,drops=[],ptc=[];

const $=id=>document.getElementById(id),cnt=n=>T.filter(t=>t.t==n).length,rem=n=>S[si][n]-cnt(n);
function beep(f,d,ty,v,f2){if(!A)return;const o=A.createOscillator(),g=A.createGain(),t=A.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(A.destination);o.start();o.stop(t+d)}
function nz(d,fq,v){if(!A)return;const b=A.createBuffer(1,A.sampleRate*d,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq;g.gain.setValueAtTime(v,A.currentTime);g.gain.linearRampToValueAtTime(0,A.currentTime+d);s.connect(f).connect(g).connect(A.destination);s.start()}
const sfx={click:()=>beep(660,.08),up:()=>{beep(200,.4,'sine',.15,600);nz(.4,700,.15)},down:()=>{beep(600,.4,'sine',.15,200);nz(.4,400,.15)},clear:()=>[523,659,784].map((f,i)=>setTimeout(()=>beep(f,.2,'triangle'),i*90)),rain:()=>nz(1,3500,.2),ok:()=>[523,659,784,1047].map((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.2),i*120)),bad:()=>beep(200,.3,'square',.1,100)};

function load(i){si=(i+S.length)%S.length;T=[];E=S[si].e();hint=0;win=0;drops=[];run=0;sel=S[si].L?'L':'H';ui();const s=S[si];ov('<h2>Stage '+(si+1)+'/20</h2><h3>'+s.n+'</h3>🎯 '+s.d+'<br><small>H '+s.H+'개 · L '+s.L+'개 (놓은 도구를 누르면 회수)</small><br><span class="f1">'+F1+'</span><br><span class="f2">'+F2+'</span>','시작!')}
function ui(){$('st').textContent='스테이지 '+(si+1)+'/20';$('tl').textContent=sel=='H'?'고기압 H 🟠':'저기압 L 🔵';$('bH').textContent='H ×'+rem('H');$('bL').textContent='L ×'+rem('L');$('bH').className=sel=='H'?'sel':'';$('bL').className=sel=='L'?'sel':''}
$('bH').onclick=()=>{sel='H';ui()};$('bL').onclick=()=>{sel='L';ui()};$('bh').onclick=()=>{hint=200;sfx.click()};$('br').onclick=()=>{T=[];E=S[si].e();win=0;drops=[];ui();sfx.click()};$('bp').onclick=()=>load(si-1);$('bn').onclick=()=>load(si+1);
cv.onpointermove=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*800/r.width;my=(e.clientY-r.top)*500/r.height};

cv.onpointerdown=e=>{A=A||new AudioContext();cv.onpointermove(e);if(!run)return;const i=T.findIndex(t=>Math.hypot(t.x-mx,t.y-my)<24);if(i>=0){T.splice(i,1);sfx.click()}else if(rem(sel)>0){T.push({t:sel,x:mx,y:my});sel=='H'?sfx.down():sfx.up()}ui()};
function fld(x,y){let fx=0,fy=0;for(const t of T){const dx=x-t.x,dy=y-t.y,d=Math.hypot(dx,dy);if(d<RD){const f=1-d/RD;if(t.t=='H'){fy+=.16*f;fx+=Math.sign(dx)*.05*f}else{fy-=.16*f;fx-=Math.sign(dx)*.02*f}}}return[fx,fy]}
const hit=(e,r)=>e.x+13>r.x&&e.x-13<r.x+r.w&&e.y+13>r.y&&e.y-13<r.y+r.h;
function die(e){e.x=e.sx;e.y=e.sy;e.vx=e.vy=0;sfx.bad()}
function step(){fr++;
for(const p of ptc){const[fx,fy]=fld(p.x,p.y);p.x+=.3+p.s*.4+fx*18;p.y+=Math.sin(fr/40+p.s*9)*.15+fy*18;if(p.x>800)p.x=0;if(p.x<0)p.x=800;if(p.y<0)p.y=430;if(p.y>440)p.y=0}
if(!run)return;const rs=E.filter(e=>e.k=='r');let all=1;
for(const e of E){
if(e.k=='m'){const[fx,fy]=fld(e.x,e.y),air=!e.gr&&!e.rain?1:0;e.vx+=fx+(air?(e.dr-e.vx)*.03:0);if(e.gr)e.vx*=.6;e.vy=Math.max(-2.5,Math.min(2.5,(e.vy+fy+e.g)*.95));e.vx*=.985;
e.x+=e.vx;for(const r of rs)if(hit(e,r)){if(r.l){die(e);break}e.x-=e.vx;e.vx=0}
e.y+=e.vy;for(const r of rs)if(hit(e,r)){if(r.l){die(e);break}e.y-=e.vy;e.vy=0}
e.x=Math.max(13,Math.min(787,e.x));if(e.y<15){e.y=15;e.vy=0}
if(e.rain){e.y=Math.max(60,Math.min(300,e.y));e.gr=0}else{e.gr=e.y>=GY-13;if(e.gr){e.y=GY-13;e.vy=0}}
const g=e.goal,ins=e.x>g[0]&&e.x<g[0]+g[2]&&e.y>g[1]&&e.y<g[1]+g[3]&&(!e.land||e.gr);
if(e.rain){if(ins)e.t++;e.ok=e.t>90;if(ins&&e.t==1)sfx.rain()}else e.ok=ins}
else if(e.k=='c'){const n=T.filter(t=>t.t=='H'&&Math.hypot(t.x-e.x,t.y-e.y)<e.cr).length;if(!e.ok){if(n>=e.need){e.a-=.006;if(e.a<.12){e.ok=1;sfx.clear()}}else{e.a=Math.min(1,e.a+.003);if(e.mon){e.y+=.12;if(e.y>390){e.y=e.sy;e.a=1;sfx.bad()}}}}}
else if(e.k=='v'){if(!e.ok){const n=T.filter(t=>t.t=='L'&&Math.hypot(t.x-e.x,t.y-e.y)<100).length;e.p=n?e.p+.006:Math.max(0,e.p-.002);if(e.p>=1){e.ok=1;sfx.rain()}}}
if((e.k=='m'||e.k=='c'||e.k=='v')&&!e.ok)all=0;
if(e.k=='v'&&e.ok||e.k=='m'&&e.rain&&e.t>0){const cx=e.x,cy=e.k=='v'?e.y-170:e.y;if(fr%2==0)drops.push({x:cx+Math.random()*80-40,y:cy+20})}}
for(const d of drops)d.y+=5;drops=drops.filter(d=>d.y<GY);
win=all?win+1:0;
if(win>45){run=0;sfx.ok();const s=S[si];ov('<h1>성공! 🎉</h1><h3>'+s.n+'</h3>🔬 '+s.ls+'<br><span class="f1">'+F1+'</span><br><span class="f2">'+F2+'</span>',si<19?'다음 스테이지 ▶':'처음부터 다시 ▶',()=>load(si+1))}}
function arrow(x1,y1,x2,y2){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();const a=Math.atan2(y2-y1,x2-x1);X.beginPath();X.moveTo(x2,y2);X.lineTo(x2-9*Math.cos(a-.5),y2-9*Math.sin(a-.5));X.lineTo(x2-9*Math.cos(a+.5),y2-9*Math.sin(a+.5));X.fill()}
function tool(t,al){X.globalAlpha=al;const g=X.createRadialGradient(t.x,t.y,4,t.x,t.y,24);g.addColorStop(0,t.t=='H'?'#fff3a0':'#d5d0ff');g.addColorStop(1,t.t=='H'?'#ff9d2e':'#5f6bff');X.fillStyle=g;X.beginPath();X.arc(t.x,t.y,22,0,7);X.fill();X.fillStyle='#fff';X.font='bold 22px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(t.t,t.x,t.y+1);X.globalAlpha=1}

X.fillStyle='#fff';for(const p of ptc){X.globalAlpha=.5;X.beginPath();X.arc(p.x,p.y,2+p.s*2,0,7);X.fill()}X.globalAlpha=1;
